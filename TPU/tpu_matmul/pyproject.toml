[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tpu-matmul"
version = "0.1.0"
description = "Matrix multiplication with NumPy fallback and JAX TPU support"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
jax = ["jax>=0.4"]
tpu = ["jax[tpu]>=0.4"]
test = ["pytest>=7"]

[project.scripts]
tpu-matmul = "tpu_matmul.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tpu_matmul*"]
